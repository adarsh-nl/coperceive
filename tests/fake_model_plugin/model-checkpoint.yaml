# The fake plugin with a checkpoint file named by an option (spec §Checkpoint staging): the
# `{option:checkpoint}` placeholder puts the path in argv before `hello`, and `checkpoint:`
# lets `model run --slurm` stage the file into scratch and rewrite the option.
spec_version: 1
name: fake
version: "0.0.1"
licence:
  notice: "fixture, no licence"
environment:
  current: true
models:
  default:
    description: one car ahead of every requested agent; hashes the checkpoint file it is given
    inputs:
      modalities: [camera, lidar]
      frames: single
    outputs:
      categories: [car, pedestrian]
      score_note: constant 0.9
      sources:
        single: fake
    resources:
      gpu: false
      cpus: 1
      memory_gb: 2
      seconds_per_sample: 0.01
    options:
      checkpoint: {type: str, default: "", description: the checkpoint file the worker hashes}
      extra: {type: bool, default: false, description: also a pedestrian per agent}
    checkpoint: {option: checkpoint}
commands:
  batch:
    [
      "{python}",
      "{plugin_dir}/worker.py",
      "--model",
      "{model}",
      "--checkpoint",
      "{option:checkpoint}",
    ]
