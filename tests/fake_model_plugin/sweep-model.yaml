# The robustness-sweep fixture: one model that reports each requested agent's ground
# truth in the body frame of the pose the frame received, so pose noise moves the
# boxes by exactly the noise and mAP falls deterministically. Tests only; see
# degrade_worker.py. The existing fake manifest (model.yaml) is unchanged.
spec_version: 1
name: fake
version: "0.0.1"
licence:
  notice: "fixture, no licence"
environment:
  current: true
models:
  degrade:
    description: the ground truth in the received pose frame (a deterministic sweep fixture)
    inputs:
      modalities: [camera]
      frames: single
    outputs:
      categories: [car, cyclist, pedestrian]
      score_note: constant 0.9
      sources:
        single: fake-degrade
    resources:
      gpu: false
      cpus: 1
      memory_gb: 1
      seconds_per_sample: 0.01
commands:
  batch: ["{python}", "{plugin_dir}/degrade_worker.py", "--model", "{model}"]
