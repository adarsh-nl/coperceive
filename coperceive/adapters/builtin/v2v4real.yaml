# SPDX-License-Identifier: Apache-2.0
# V2V4Real (Xu et al., CVPR 2023, arXiv:2303.07601), the OpenCOOD release layout.
# The released tree is OpenCOOD-style: <split>/<scenario>/<agent>/, with scenario
# names starting "testoutput_CAV_data_" and two vehicle agents (0 and 1).
# The official loader reads lidar_pose [x,y,z,roll,yaw,pitch] and applies no
# reflection (x_to_world in opencood/utils/transformation_utils.py). Whether the
# released coordinates are CARLA-left-handed is UNVERIFIED; the provisional
# reflection here matches the OPV2V-style layout and must be checked against a
# real extracted scene (docs/datasets/v2v4real.md).
adapter: v2v4real
spec_version: 1

licence:
  status: unknown
  notice: >-
    No data licence is stated. The V2V4Real README
    (https://github.com/ucla-mobility/V2V4Real) links the paper and the repository
    LICENSE (https://github.com/ucla-mobility/V2V4Real/blob/main/LICENSE) is an
    Academic Software License for the code, not a grant for the data. Terms unknown
    as of 2026-11-05; cite Xu et al., V2V4Real, CVPR 2023, arXiv:2303.07601.
    Research use on the HPC only; no frames, crops, screenshots or derived scene
    files in a public repository.
  links:
    - https://github.com/ucla-mobility/V2V4Real
    - https://arxiv.org/abs/2303.07601

params:
  split:
    allowed: [train, test]

world_frame: v2v4real-world  # unverified: see docs/datasets/v2v4real.md

clock:
  from: frame
  unit: frame
  scale_us: 100000
  scale_note: >-
    time_us = stem * 100000. The real extracted test stems increase by 1
    (000000, 000001, ...) and the V2V4Real paper (CVPR 2023, Section 3) says
    "We sample the frames at 10Hz", so the step is 0.1 s. A 147-frame scenario
    is 14.7 s (10-20 s per the paper), not the 7.35 s a 0.05 s assumption gives.

scenes:
  glob:
    path: "{split}/{scene}/"
    sample_source: poses
    platform:
      split: {param: split}

agents:
  discover: {glob: "{split}/{scene}/{agent}/", type: vehicle}

conventions:
  length_unit: m
  angle_unit: deg
  source_handedness: left
  reflect_axis: y
  body_axes: FLU
  camera_axes: FLU  # unused: the extracted V2V4Real release is LiDAR-only

streams:
  poses:
    reader: yaml_record
    path: "{agent_root}/{frame:06d}.yaml"
    missing: skip
    translation: [lidar_pose.0, lidar_pose.1, lidar_pose.2]
    rotation:
      # The YAML order is roll, yaw, pitch; euler fields are (about x, about y, about z).
      euler: {fields: [lidar_pose.3, lidar_pose.5, lidar_pose.4], order: zyx, frame: intrinsic}

  sensors:
    # The extracted release has no camera records (LiDAR-only). The camera block
    # is kept for the published format, but no records means only the fixed lidar.
    reader: yaml_record
    path: "{agent_root}/{frame:06d}.yaml"
    sample: first
    records: {prefix: camera, optional: true}  # LiDAR-only release: no camera keys
    extrinsic:
      # "extrinsic matrix from camera to LiDAR" (OpenCOOD data-annotation page); the pose
      # stream is the lidar pose, so the lidar frame is the body frame.
      matrix: {field: extrinsic, shape: 4x4}
      direction: child_to_parent
    intrinsic: {matrix: intrinsic}
    image_size:
      derive: principal_point_x2
      reason: "800x600 PNGs; cx, cy are 400, 300 in every file checked (2026-10-18)."
    modality:
      - {has_intrinsic: true, modality: camera}
      - {default: camera}
    fixed:
      - {id: lidar, modality: lidar}

  boxes:
    reader: yaml_record
    path: "{agent_root}/{frame:06d}.yaml"
    missing: skip
    frame: world
    records: {path: vehicles, mapping_key: track_id}
    # angle is [roll, yaw, pitch] in degrees (OpenCOOD data-annotation page).
    fields: {roll: angle.0, yaw: angle.1, pitch: angle.2}
    centre:
      location: [location.0, location.1, location.2]
      offset: [center.0, center.1, center.2]
      offset_frame: box
    size:
      half_extents: [extent.0, extent.1, extent.2]
    rotation:
      euler: {fields: [roll, pitch, yaw], order: zyx, frame: intrinsic}
    track_id_cast: int_string
    fill:
      category: vehicle
      reason: "The format has no class field; the OPV2V paper annotates vehicles only."

  lidar:
    reader: pcd
    sensor: lidar
    path: "{agent_root}/{frame:06d}.pcd"
    missing: skip
    fields: {x: x, y: y, z: z}
    intensity:
      fill: 0.0
      reason: "The PCD fields are x y z rgb; there is no intensity."

checks:
  required_per_sample: [poses]
