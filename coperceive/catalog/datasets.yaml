# SPDX-License-Identifier: Apache-2.0
# Versioned dataset catalog. Sizes are not stored here.
# Griffin byte counts come from `coperceive dataset dry-run`, which reads the
# Hugging Face tree for wjh-svm/Griffin. A dry-run on 2026-10-24 of
# https://huggingface.co/api/datasets/wjh-svm/Griffin/tree/main/datasets/griffin_50scenes_25m
# listed 15 files summing to 167,190,016,122 bytes (same total as
# docs/design/griffin-verification.md, tree API, 2026-10-15).
# Dev tier (md5.txt + drone_metadata.zip + vehicle_metadata.zip + vehicle_lidar.zip)
# was 239,749,191 bytes. RGB cameras plus those four files, excluding the two
# instance-segmentation zips, was 162,515,011,954 bytes. The app shows the
# live dry-run, not these sentences.

datasets:
  # Griffin toolkit licence fetched 2026-10-24:
  # https://raw.githubusercontent.com/wang-jh18-SVM/Griffin/main/LICENSE.txt
  # starts "MIT License" / "Copyright (c) [2025] [Jiahao Wang]".
  # Dataset card https://huggingface.co/datasets/wjh-svm/Griffin README YAML
  # says `license: mit` (fetched the same day).
  # Paper title fetched 2026-10-24 from https://arxiv.org/abs/2503.06983 :
  # "Griffin: Aerial-Ground Cooperative Detection and Tracking Dataset and Benchmark".
  # Also cited in docs/design/griffin-verification.md (abs page fetched 2026-10-15).
  - id: "griffin"
    name: "Griffin"
    description: "Cooperative vehicle and drone perception in CARLA and AirSim."
    modalities:
      - "LiDAR"
      - "Camera"
    agents: "vehicle + drone"
    licence: "MIT"
    licence_url: "https://raw.githubusercontent.com/wang-jh18-SVM/Griffin/main/LICENSE.txt"
    source_url: "https://huggingface.co/datasets/wjh-svm/Griffin"
    paper_url: "https://arxiv.org/abs/2503.06983"
    status: "ready"
    requires_terms: true
    presets:
      - id: "dev"
        name: "Dev tier"
        description: "Metadata and vehicle LiDAR for the 25 m subset. The size is measured when you choose this preset."
        subset: "25m"
        griffin_preset: "dev"
        open_scene: "Town03-000"
      - id: "one-scene"
        name: "One scene with images"
        description: "Town03-000 with camera images. The dataset host stores each camera as one zip for the whole 25 m subset, so this downloads those camera archives plus metadata and LiDAR, not a Town03-000 slice. Instance-segmentation archives are left out. The size is measured when you choose this preset."
        subset: "25m"
        components: "metadata,lidar,drone_camera_front,drone_camera_back,drone_camera_left,drone_camera_right,drone_camera_bottom,vehicle_camera_front,vehicle_camera_back,vehicle_camera_left,vehicle_camera_right"
        open_scene: "Town03-000"
      - id: "full"
        name: "Full 25 m subset"
        description: "Every file in the 25 m subset, including instance-segmentation archives. The size is measured when you choose this preset."
        subset: "25m"
        components: "*"
        open_scene: "Town03-000"

  # OPV2V paper is the one named in coperceive/adapters/builtin/opv2v.yaml.
  # No data licence is recorded there. Do not download the frames.
  - id: "opv2v"
    name: "OPV2V"
    description: "Vehicle-to-vehicle perception benchmark."
    modalities:
      - "LiDAR"
      - "Camera"
    agents: "vehicle + vehicle"
    licence: "unknown"
    source_url: "https://github.com/DerrickXuNu/OPV2V"
    paper_url: "https://arxiv.org/abs/2109.07644"
    status: "local-import"
    requires_terms: false
    notice: "The data licence is not recorded here. Choose a folder you already have, then import it. Nothing is downloaded."

  # V2XSet paper is the one named in coperceive/adapters/builtin/v2xset.yaml.
  - id: "v2xset"
    name: "V2XSet"
    description: "Vehicle and infrastructure perception benchmark."
    modalities:
      - "LiDAR"
      - "Camera"
    agents: "vehicle + infrastructure"
    licence: "unknown"
    source_url: "https://github.com/DerrickXuNu/v2x-vit"
    paper_url: "https://arxiv.org/abs/2203.10638"
    status: "local-import"
    requires_terms: false
    notice: "The data licence is not recorded here. Choose a folder you already have, then import it. Nothing is downloaded."

  # README fetched 2026-10-24 from
  # https://raw.githubusercontent.com/ucla-mobility/V2V4Real/main/README.md
  # links the paper https://arxiv.org/abs/2303.07601 and does not state a data licence.
  # https://raw.githubusercontent.com/ucla-mobility/V2V4Real/main/LICENSE
  # is an Academic Software License for the code, not a data grant.
  - id: "v2v4real"
    name: "V2V4Real"
    description: "Real-world vehicle-to-vehicle perception recordings."
    modalities:
      - "LiDAR"
      - "Camera"
    agents: "vehicle + vehicle"
    licence: "unknown"
    source_url: "https://github.com/ucla-mobility/V2V4Real"
    paper_url: "https://arxiv.org/abs/2303.07601"
    status: "planned"
    requires_terms: false
    notice: "Not available yet. The data licence was not stated in the repository README checked on 2026-10-24."
