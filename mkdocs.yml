site_name: Coperceive
site_description: Cooperative multi-agent perception data.
site_url: https://adarsh-nl.github.io/coperceive/docs/
site_dir: docs_site
docs_dir: docs
strict: true
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
plugins:
  - search
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
exclude_docs: |
  ci.md
  design/*.md
  design/**/*.md
  design/**/*.json
  log/
  media/
  release/
  superpowers/
nav:
  - Get started:
      - What Coperceive is: index.md
      - Install: get-started/install.md
      - Quick start: get-started/quick-start.md
      - Local and cluster: get-started/local-and-cluster.md
  - Datasets:
      - datasets/index.md
      - OPV2V: datasets/opv2v.md
      - V2XSet: datasets/v2xset.md
      - V2V4Real: datasets/v2v4real.md
      - DAIR-V2X-C: datasets/dair-v2x-c.md
      - Griffin: datasets/griffin.md
      - Demo: datasets/demo.md
      - Bring your own: datasets/bring-your-own.md
      - Longer notes:
          - OPV2V and V2XSet — details: datasets/opencood.md
          - V2V4Real — details: datasets/v2v4real-details.md
          - DAIR-V2X-C — details: datasets/dair-v2x-c-details.md
          - Griffin — details: datasets/griffin-details.md
          - Demo — details: datasets/demo-details.md
          - Generic format: spec/generic-multiview.md
  - Guides:
      - guides/index.md
      - View a scene: guides/view-a-scene.md
      - Open a dataset on a cluster: guides/cluster.md
      - Evaluate predictions: guides/evaluate.md
      - Robustness sweeps: guides/robustness.md
      - Run a model: guides/run-a-model.md
      - Result bundles: guides/bundles.md
      - Longer notes:
          - Viewer: viewer.md
          - Validate: validate.md
          - Evaluate: eval.md
