[package]
name = "coperceive-desktop"
version = "0.1.0"
description = "coperceive desktop shell"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
getrandom = "0.2"
serde_json = "1"
tauri = { version = "2.12", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = false
codegen-units = 16
panic = "abort"
strip = true
