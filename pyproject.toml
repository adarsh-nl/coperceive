[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coperceive"
version = "0.1.0"
description = "Cooperative multi-agent perception data library."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adarsh (github.com/adarsh-nl)" }]
keywords = ["cooperative-perception", "multi-agent", "autonomous-driving"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Upper bounds are intentionally absent. Pip selects the newest build each
    # interpreter can install: NumPy 2.3+ and PyArrow 22+ drop Python 3.10.
    "numpy>=1.26.4",
    "pyarrow>=18",
    "pillow>=10.4",
    "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/adarsh-nl/coperceive"
Repository = "https://github.com/adarsh-nl/coperceive"
Source = "https://github.com/adarsh-nl/coperceive"

[project.optional-dependencies]
torch = ["torch"]
viewer = ["rerun-sdk==0.22.1", "viser==0.2.23"]
plot = ["matplotlib>=3.8"]
app = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2", "matplotlib>=3.8"]
griffin = ["huggingface_hub>=0.26"]
docs = ["mkdocs-material>=9.5"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "playwright>=1.49",
    "types-PyYAML>=6",
    "matplotlib>=3.8",
]

[project.scripts]
coperceive = "coperceive.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["coperceive"]
# coperceive/app/static is built by scripts/build_web_static.sh and gitignored;
# artifacts keeps those built files inside the wheel anyway.
artifacts = ["coperceive/app/static/**"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["coperceive", "tests"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# The Griffin plugin runs on Python 3.8: typing.Dict/List/Optional stay where they are
# evaluated at runtime (type aliases), and no `X | Y` outside annotations.
"plugins/griffin/**" = ["UP006", "UP007", "UP035", "UP045"]

[tool.pyright]
include = ["coperceive", "tests"]
exclude = [
    "coperceive/app",
    "coperceive/griffin",
    "tests/test_app.py",
    "tests/test_griffin.py",
    "tests/test_griffin_phase2.py",
]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/griffin/tests"]
addopts = "-q"
markers = ["slow: needs a local Griffin release (set COPERCEIVE_GRIFFIN_RAW)"]

[tool.coverage.run]
source = ["coperceive"]
branch = true
