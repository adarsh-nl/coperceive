[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkg"
version = "0.0.0"
description = "Placeholder-named library for cooperative multi-agent perception data. The distribution name is temporary."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adarsh (github.com/adarsh-nl)" }]
keywords = ["cooperative-perception", "multi-agent", "autonomous-driving"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Upper bounds are intentionally absent. Pip selects the newest build each
    # interpreter can install: NumPy 2.3+ and PyArrow 22+ drop Python 3.10.
    "numpy>=1.26.4",
    "pyarrow>=18",
]

[project.optional-dependencies]
torch = ["torch"]
viewer = ["rerun-sdk==0.22.1", "viser==0.2.23"]
app = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2"]
griffin = ["huggingface_hub>=0.26"]
docs = ["mkdocs-material>=9.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "pyright>=1.1.390", "httpx>=0.27"]

[project.scripts]
pkg = "pkg.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pkg"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["pkg", "tests"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pyright]
include = ["pkg", "tests"]
exclude = ["pkg/app", "pkg/griffin", "tests/test_app.py", "tests/test_griffin.py"]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pkg"]
branch = true
