[package]
name = "coperceive-desktop"
version = "0.1.1"
edition = "2021"

[lib]
name = "coperceive_desktop"
path = "src/lib.rs"

[[bin]]
name = "coperceive-desktop"
path = "src/main.rs"
test = false

[dependencies]
getrandom = "0.3"
regex = "1"
sha1 = "0.10"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-updater = "2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[profile.release]
strip = true

