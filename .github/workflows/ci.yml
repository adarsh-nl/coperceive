name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pyright is configured with venv = ".venv". A toolcache install is not a
      # virtualenv, so strict mode treated TestClient.get as unknown. The app
      # extra is required because tests/test_hdmap.py imports FastAPI.
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[app,dev,viewer]"
      - run: .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[app,griffin,dev,viewer]"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest

  web:
    # The committed API contract and the generated client must not drift.
    # openapi.json is regenerated from the app and diffed; schema.ts is
    # regenerated from openapi.json and diffed. See CONTRIBUTING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[app]"
      - name: openapi.json matches the app
        run: |
          python -c "import json,tempfile; from coperceive.app.server import create_app; print(json.dumps(create_app(root=tempfile.mkdtemp(), token=None).openapi(), indent=2))" > /tmp/openapi.json
          diff -u web/openapi.json /tmp/openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: schema.ts matches openapi.json
        run: npx openapi-typescript openapi.json -o /tmp/schema.ts && diff -u src/api/schema.ts /tmp/schema.ts
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - name: committed bundle matches a fresh build
        # coperceive/app/static ships in the wheel; it must be what web/src builds.
        run: |
          npm run build
          git status --porcelain -- coperceive/app/static
          test -z "$(git status --porcelain -- coperceive/app/static)" || { git diff --stat -- coperceive/app/static; echo "coperceive/app/static is stale: run npm run build in web/ and commit it"; exit 1; }
        working-directory: web

  e2e:
    # The page in a real browser: play, scene switch, predictions, empty states.
    # The bundle is built from web/ here, so the test sees the current source,
    # not the committed coperceive/app/static.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[app,dev]"
      - run: playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: npx vite build --outDir /tmp/web-dist --emptyOutDir
        working-directory: web
      - run: pytest tests/test_viewer_browser.py -q -rs
        env:
          COPERCEIVE_WEB_DIST: /tmp/web-dist
          COPERCEIVE_E2E_SHOTS: /tmp/e2e-shots
          COPERCEIVE_E2E_REQUIRED: "1"  # a browser or bundle problem fails here, it does not skip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screenshots
          path: /tmp/e2e-shots
          if-no-files-found: ignore

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  desktop-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Run Rust unit tests
        run: cargo test
        working-directory: src-tauri
      - name: Build macOS Application Bundle
        run: |
          cargo build --release
          mkdir -p dist/Coperceive.app/Contents/MacOS
          mkdir -p dist/Coperceive.app/Contents/Resources
          cp target/release/coperceive-desktop dist/Coperceive.app/Contents/MacOS/coperceive
          cp -r ../coperceive/app/static dist/Coperceive.app/Contents/Resources/
          cat << 'EOF' > dist/Coperceive.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>coperceive</string>
            <key>CFBundleIdentifier</key>
            <string>nl.adarsh.coperceive</string>
            <key>CFBundleName</key>
            <string>Coperceive</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "Coperceive" -srcfolder dist/Coperceive.app -ov -format UDZO dist/Coperceive-macos-arm64.dmg
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: coperceive-desktop-macos-arm64
          path: |
            src-tauri/dist/Coperceive-macos-arm64.dmg
            src-tauri/dist/Coperceive.app
