name: ci

on:
  push:
    branches:
      - main
      - feat/m2-import
      - 'release/**'
  pull_request:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            desktop:
              - 'src-tauri/**'
              - 'web/**'
              - 'coperceive/app/**'
              - 'scripts/desktop/**'
              - 'pyproject.toml'
              - '**/*lock*'
              - '.github/workflows/**'
      - name: Guard check filter accuracy
        if: github.event_name == 'pull_request'
        run: |
          DESKTOP_FILTER="${{ steps.filter.outputs.desktop }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -z "${BASE_SHA}" ]; then
            echo "::error title=FilterGuard::BASE_SHA is empty"
            exit 1
          fi
          if ! git rev-parse --verify "${BASE_SHA}" >/dev/null 2>&1; then
            echo "::error title=FilterGuard::BASE_SHA ${BASE_SHA} not found in git history"
            exit 1
          fi
          CHANGED_CRITICAL=$(git diff --name-only "${BASE_SHA}"...HEAD | grep -E '^(src-tauri/|web/|coperceive/app/|scripts/desktop/|pyproject\.toml|\.github/workflows/|.*lock.*)' || true)
          if [ -n "${CHANGED_CRITICAL}" ] && [ "${DESKTOP_FILTER}" != "true" ]; then
            echo "::error title=FilterGuard::Critical desktop paths changed but filter reported skip!"
            echo "Changed critical files:"
            echo "${CHANGED_CRITICAL}"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Pyright is configured with venv = ".venv". A toolcache install is not a
      # virtualenv, so strict mode treated TestClient.get as unknown. The app
      # extra is required because tests/test_hdmap.py imports FastAPI.
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[app,dev,viewer]"
      - run: .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/pyright
      # coperceive/app/static is built (scripts/build_web_static.sh), never
      # committed; a merge once dropped its .gitignore rule and a bundle got in.
      - name: The built viewer bundle is not tracked
        run: |
          tracked="$(git ls-files -- coperceive/app/static)"
          if [ -n "${tracked}" ]; then
            echo "::error title=BuiltBundleTracked::coperceive/app/static is built, not committed. Untrack it with: git rm -r --cached coperceive/app/static"
            echo "${tracked}" | head -n 20
            exit 1
          fi
          git check-ignore -q coperceive/app/static/index.html || {
            echo "::error title=BuiltBundleTracked::.gitignore no longer ignores coperceive/app/static/"
            exit 1
          }
      - name: Shipped web source contains no personal identifiers
        run: |
          if grep -rnE "nanjaiyalathaa|ewi\.utwente\.nl" web/src; then
            echo "::error title=PersonalIdentifiersFound::Personal identifiers found in web/src"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[app,griffin,dev,viewer]"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run pytest
        run: |
          set +e
          pytest -q --tb=line | tee /tmp/pytest.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 30 /tmp/pytest.txt | while IFS= read -r line; do
              echo "::error title=Pytest::$line"
            done
            exit "$status"
          fi

  web:
    # The committed API contract and the generated client must not drift.
    # openapi.json is regenerated from the app and diffed; schema.ts is
    # regenerated from openapi.json and diffed. See CONTRIBUTING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[app]"
      - name: openapi.json matches the app
        run: |
          python -c "import json,tempfile; from coperceive.app.server import create_app; print(json.dumps(create_app(root=tempfile.mkdtemp(), token=None).openapi(), indent=2))" > /tmp/openapi.json
          diff -u web/openapi.json /tmp/openapi.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: schema.ts matches openapi.json
        run: npx openapi-typescript openapi.json -o /tmp/schema.ts && diff -u src/api/schema.ts /tmp/schema.ts
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npm test
        working-directory: web
      - name: Build the viewer bundle
        # coperceive/app/static is built, never committed (see .gitignore).
        run: bash scripts/build_web_static.sh
      - name: Viewer bundle is complete
        run: python3 scripts/check_bundle_assets.py --static coperceive/app/static
      - name: Wheel ships the viewer bundle
        run: |
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir /tmp/coperceive-wheel
          python3 scripts/check_bundle_assets.py --wheel /tmp/coperceive-wheel/*.whl

  e2e:
    # The page in a real browser: play, scene switch, predictions, empty states.
    # The bundle is built from web/ here, so the test sees the current source,
    # not the committed coperceive/app/static.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[app,dev]"
      - run: playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: npx vite build --mode test --outDir /tmp/web-dist --emptyOutDir
        working-directory: web
      - run: pytest tests/test_viewer_browser.py tests/test_viewer_slow_points.py -q -rs
        env:
          COPERCEIVE_WEB_DIST: /tmp/web-dist
          COPERCEIVE_E2E_SHOTS: /tmp/e2e-shots
          COPERCEIVE_E2E_REQUIRED: "1"  # a browser or bundle problem fails here, it does not skip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-screenshots
          path: /tmp/e2e-shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-media
          path: |
            docs/media/Town03-000.png
            docs/media/Town03-000-split.png
            docs/media/hero_recording.mp4
          if-no-files-found: error

  landing:
    # Build and verify the coperceive public landing page (bundle, E2E, a11y, media recording)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[app,dev]"
      - run: playwright install --with-deps chromium
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Same install as pages.yml deploys with: plain npm ci, no --legacy-peer-deps.
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: E2E and A11y tests
        run: pytest tests/test_landing_page.py -v
        env:
          COPERCEIVE_E2E_REQUIRED: "1"
      - name: Measure frame-time & record hero video
        run: |
          mkdir -p /tmp/landing-artifacts
          python scripts/site/measure_and_record.py
        env:
          COPERCEIVE_ARTIFACT_DIR: /tmp/landing-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: landing-page-media
          path: |
            /tmp/landing-artifacts/landing_page.png
            /tmp/landing-artifacts/hero_recording.webm
          if-no-files-found: error

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1 || {
            echo "## Gitleaks Findings" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            ./gitleaks detect --source . --config .gitleaks.toml --no-banner --report-path /tmp/gitleaks.json || true
            cat /tmp/gitleaks.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  desktop-linux:
    runs-on: ubuntu-22.04
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[app]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Build web static assets
        run: bash scripts/build_web_static.sh
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 imagemagick libfuse2 squashfs-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "linux-tauri"
      - name: Cache bundled Python runtime and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coperceive-desktop
            ~/.cache/pip
          key: bundled-python-${{ runner.os }}-${{ hashFiles('scripts/desktop/requirements-linux-x86_64.lock') }}
          restore-keys: |
            bundled-python-${{ runner.os }}-
      - name: Bundle Python Standalone Runtime
        run: python3 scripts/desktop/bundle_python.py --target x86_64-unknown-linux-gnu --skip-web-build
      - name: Run Rust unit tests
        run: |
          for i in $(seq 20); do
            echo "=== Rust unit tests run ${i}/20 ==="
            cargo test --manifest-path src-tauri/Cargo.toml -q || exit 1
          done
      - name: Sync Desktop Bundle Version
        run: bash scripts/desktop/sync_version.sh
      - name: Build Tauri Desktop (AppImage and deb)
        run: ( cd web && npm run tauri build -- --bundles appimage,deb --verbose )
      - name: Verify packaged app ships the viewer bundle
        run: |
          DEB_FILE=$(find src-tauri/target -iname "*.deb" -type f | head -n 1)
          test -n "${DEB_FILE}" || { echo "No .deb package found" >&2; exit 1; }
          python3 scripts/check_bundle_assets.py --app "${DEB_FILE}"
      - name: Inspect Linux Package Sizes and Top Paths
        run: |
          DEB_FILE=$(find src-tauri/target -iname "*.deb" -type f | head -n 1)
          APPIMAGE_FILE=$(find src-tauri/target -iname "*.AppImage" -type f | head -n 1)
          echo "=== Debian Package Size ==="
          ls -lh "${DEB_FILE}"
          echo "=== Top 25 Largest Files in .deb ==="
          (dpkg-deb -c "${DEB_FILE}" | sort -k3 -n -r || true) | head -n 25
          echo "=== AppImage Package Size ==="
          ls -lh "${APPIMAGE_FILE}"
          echo "=== Top 25 Largest Files in Bundled Python ==="
          (find src-tauri/resources/python -type f -exec ls -la {} + | sort -k5 -n -r || true) | head -n 25
      - name: Run Linux Smoke Test on Installed Debian Package
        run: |
          DEB_FILE=$(find src-tauri/target -iname "*.deb" -type f | head -n 1)
          test -n "${DEB_FILE}" || { echo "No .deb package found" >&2; exit 1; }
          DEB_ABS="$(readlink -f "${DEB_FILE}")"
          echo "Installing ${DEB_ABS} via apt-get..."
          sudo apt-get install -y "${DEB_ABS}"
          INSTALLED_BIN="/usr/bin/coperceive-desktop"
          test -x "${INSTALLED_BIN}" || { echo "Installed binary not found at ${INSTALLED_BIN}" >&2; exit 1; }
          xvfb-run -a -s "-screen 0 1920x1080x24" bash scripts/desktop/smoke_test_linux.sh "${INSTALLED_BIN}"
          echo "Removing installed Debian package..."
          PKG_NAME="$(dpkg-deb -f "${DEB_ABS}" Package 2>/dev/null || echo coperceive)"
          sudo dpkg -r "${PKG_NAME}" || sudo apt-get remove -y "${PKG_NAME}"
      - name: Locate Built Linux Packages
        run: |
          DEB_FILE=$(find src-tauri/target -iname "*.deb" -type f | head -n 1)
          APPIMAGE_FILE=$(find src-tauri/target -iname "*.AppImage" -type f | head -n 1)
          echo "DEB_FILE=${DEB_FILE}" >> $GITHUB_ENV
          echo "APPIMAGE_FILE=${APPIMAGE_FILE}" >> $GITHUB_ENV
          echo "Located Debian package at: ${DEB_FILE}"
          echo "Located AppImage package at: ${APPIMAGE_FILE}"
      - uses: actions/upload-artifact@v4
        with:
          name: coperceive-desktop-linux-deb
          path: ${{ env.DEB_FILE }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coperceive-desktop-linux-appimage
          path: ${{ env.APPIMAGE_FILE }}
          if-no-files-found: error
      - name: Upload Linux screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-screenshots
          path: /tmp/e2e-shots/*.png

  desktop-windows:
    runs-on: windows-latest
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[app]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Build web static assets
        shell: bash
        run: bash scripts/build_web_static.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "windows-tauri"
      - name: Cache bundled Python runtime and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\coperceive-desktop
            ~\AppData\Local\pip\Cache
          key: bundled-python-${{ runner.os }}-${{ hashFiles('scripts/desktop/requirements-windows-x86_64.lock') }}
          restore-keys: |
            bundled-python-${{ runner.os }}-
      - name: Bundle Python Standalone Runtime
        shell: bash
        run: python scripts/desktop/bundle_python.py --target x86_64-pc-windows-msvc --skip-web-build
      - name: Run Rust unit tests
        run: cargo test --lib --verbose --color=never
        working-directory: src-tauri
      - name: Sync Desktop Bundle Version
        shell: bash
        run: bash scripts/desktop/sync_version.sh
      - name: Build Tauri Desktop (NSIS installer)
        shell: bash
        run: |
          cd web && npm run tauri build -- --bundles nsis --verbose
      - name: Verify packaged app ships the viewer bundle
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer found"
            exit 1
          }
          $extractDir = Join-Path $env:RUNNER_TEMP "nsis-extract"
          7z x $installer.FullName -o"$extractDir"
          python scripts/check_bundle_assets.py --app $extractDir
      - name: Run Windows Smoke Test on Installed NSIS Package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer found"
            exit 1
          }
          Write-Host "Installing NSIS package silently: $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3

          $installedExe = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "coperceive-desktop.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installedExe) {
            $installedExe = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "Coperceive.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $installedExe) {
            Write-Host "Falling back to search across LOCALAPPDATA and PROGRAMFILES..."
            $installedExe = Get-ChildItem -Path @($env:LOCALAPPDATA, $env:ProgramFiles) -Filter "*coperceive*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          }
          if (-not $installedExe) {
            Write-Error "Could not locate installed coperceive executable after silent install"
            exit 1
          }
          Write-Host "Found installed application at $($installedExe.FullName)"
          $installDir = $installedExe.DirectoryName

          # Run smoke test against the INSTALLED executable
          pwsh scripts/desktop/smoke_test_windows.ps1 $installedExe.FullName

          # Silent uninstall
          $uninstaller = Get-ChildItem -Path $installDir -Filter "*uninstall*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            Write-Error "Could not find uninstaller in $installDir"
            exit 1
          }
          Write-Host "Uninstalling silently: $($uninstaller.FullName)"
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S _?=$installDir" -Wait
          Start-Sleep -Seconds 3

          if (Test-Path $installedExe.FullName) {
            Write-Error "Installed exe $($installedExe.FullName) still exists after silent uninstall!"
            exit 1
          }
          Write-Host "Uninstall verified: $installDir is removed."
      - name: Locate Built Windows Installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer found"
            exit 1
          }
          Write-Host "Located NSIS installer at $($installer.FullName)"
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: coperceive-desktop-windows-x86_64
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
      - name: Upload Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-screenshots
          path: ${{ runner.temp }}/e2e-shots/*.png

  desktop-macos:
    runs-on: macos-15
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # --legacy-peer-deps: openapi-typescript's peer range predates TypeScript 6
      # (see web/package.json); npm 10+ refuses the install without this.
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: bash scripts/build_web_static.sh
      - run: npm test
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "macos-tauri"
      - name: Cache bundled Python runtime and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coperceive-desktop
            ~/Library/Caches/pip
          key: bundled-python-${{ runner.os }}-${{ hashFiles('scripts/desktop/requirements-darwin-arm64.lock') }}
          restore-keys: |
            bundled-python-${{ runner.os }}-
      - name: Bundle Python Standalone Runtime
        run: bash scripts/desktop/bundle_python.sh
      - name: Run Rust unit tests
        run: cargo test --verbose --color=never 2>&1 | tee /tmp/cargo_test.log
        working-directory: src-tauri
      - name: Report Cargo Test Failure
        if: failure()
        run: |
          echo "### Cargo Test Failures" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 35 "Caused by:" /tmp/cargo_test.log >> $GITHUB_STEP_SUMMARY 2>&1 || true
          tail -n 80 /tmp/cargo_test.log >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          (grep -A 35 "Caused by:" /tmp/cargo_test.log 2>/dev/null || true) | head -n 35 | while IFS= read -r line; do
            echo "::error title=CargoError::$line"
          done
      - name: Sync Desktop Bundle Version
        run: bash scripts/desktop/sync_version.sh
      - name: Build Tauri Desktop (.app and .dmg)
        # Bounded retry around the DMG bundling: hdiutil create intermittently
        # fails with "Resource busy" on the macOS runners (runner-images#7522,
        # XProtectBehaviorService locking a freshly created image). The script
        # only retries that exact signature and logs hdiutil state each attempt.
        run: bash scripts/desktop/build_dmg.sh aarch64-apple-darwin
      - name: Report Tauri Build Failure
        if: failure()
        run: |
          if [ -f /tmp/tauri_build.log ]; then
            echo "### Tauri Build Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 /tmp/tauri_build.log >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 45 /tmp/tauri_build.log | while IFS= read -r line; do
              echo "::error title=TauriBuildError::$line"
            done
          fi
      - name: Verify packaged app ships the viewer bundle
        run: |
          APP="$(find src-tauri/target -type d -name Coperceive.app | head -n 1)"
          test -n "${APP}" || { echo "No Coperceive.app found" >&2; exit 1; }
          python3 scripts/check_bundle_assets.py --app "${APP}"
      - name: Run Headless Smoke Test and Measure Sizes
        run: bash scripts/desktop/smoke_test.sh 2>&1 | tee /tmp/smoke_test.log
      - name: Report Smoke Test Failure
        if: failure()
        run: |
          if [ -f /tmp/smoke_test.log ]; then
            echo "### Smoke Test Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/smoke_test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 10 /tmp/smoke_test.log | while IFS= read -r line; do
              echo "::error title=SmokeTestError::$line"
            done
          fi
      - name: Run Real-App macOS UI E2E Test
        run: |
          set -o pipefail
          bash scripts/desktop/e2e_mac.sh 2>&1 | tee /tmp/e2e_mac.log
          python3 scripts/desktop/verify_e2e_steps.py /tmp/e2e_mac.log
      - name: Report E2E Failure
        if: failure()
        run: |
          if [ -f /tmp/e2e_mac.log ]; then
            echo "### E2E Test Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat /tmp/e2e_mac.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E 'E2E_FAIL|E2E_MARK|Error:' /tmp/e2e_mac.log | tail -n 20 | while IFS= read -r line; do
              echo "::error title=E2ETestError::$line"
            done || true
            tail -n 15 /tmp/e2e_mac.log | while IFS= read -r line; do
              echo "::error title=E2ETestError::$line"
            done
          fi
      - name: Run HPC server-profile E2E with a fake ssh
        # Packaged app, real "Test connection" code, three committed server
        # profiles (Slurm GPU, ProxyJump alias, no scheduler). No network.
        run: bash scripts/desktop/e2e_hpc_fake_ssh.sh 2>&1 | tee /tmp/e2e_hpc.log
      - name: Report HPC E2E results and failures
        if: always()
        run: |
          if [ -f /tmp/e2e_hpc.log ]; then
            echo "### HPC server-profile E2E (fake ssh)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E 'E2E_HPC_MARK|E2E_PLAN_MARK|E2E_WATCH_MARK|E2E_REPORT_MARK|E2E_SAVE_MARK|E2E_SHARE_MARK|Step verified|E2E_HPC_FAIL|E2E_PLAN_FAIL|E2E_WATCH_FAIL|E2E_REPORT_FAIL|E2E_SHARE_FAIL' /tmp/e2e_hpc.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E 'E2E_HPC_MARK|E2E_PLAN_MARK|E2E_WATCH_MARK|E2E_REPORT_MARK|E2E_SAVE_MARK|E2E_SHARE_MARK|Step verified' /tmp/e2e_hpc.log | while IFS= read -r line; do
              echo "::notice title=hpc-e2e::$line"
            done || true
            grep -E 'E2E_HPC_FAIL|E2E_PLAN_FAIL|E2E_WATCH_FAIL|E2E_REPORT_FAIL|E2E_SAVE_FAIL|E2E_SHARE_FAIL' /tmp/e2e_hpc.log | while IFS= read -r line; do
              echo "::error title=hpc-e2e::$line"
            done || true
          fi

      - name: Run cluster-dataset E2E
        run: bash scripts/desktop/e2e_cluster_datasets.sh 2>&1 | tee /tmp/e2e_cluster_datasets.log
      - name: Report cluster-dataset E2E results
        if: always()
        run: |
          if [ -f /tmp/e2e_cluster_datasets.log ]; then
            echo "### Cluster datasets E2E" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E 'E2E_DATASET_MARK|Step CD-|E2E_DATASET_FAIL' /tmp/e2e_cluster_datasets.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E 'Step CD-|E2E_DATASET_MARK' /tmp/e2e_cluster_datasets.log | while IFS= read -r line; do
              echo "::notice title=cluster-datasets-e2e::$line"
            done || true
            grep -E 'E2E_DATASET_FAIL' /tmp/e2e_cluster_datasets.log | while IFS= read -r line; do
              echo "::error title=cluster-datasets-e2e::$line"
            done || true
          fi

      - name: Run cluster-dataset packaged-app E2E with a fake ssh
        run: bash scripts/desktop/e2e_cluster_datasets_app.sh 2>&1 | tee /tmp/e2e_cluster_datasets_app.log
      - name: Report cluster-dataset packaged-app E2E results
        if: always()
        run: |
          if [ -f /tmp/e2e_cluster_datasets_app.log ]; then
            echo "### Cluster datasets packaged-app E2E" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E 'E2E_DATASET_APP_MARK|Step CD-|E2E_DATASET_APP_FAIL' /tmp/e2e_cluster_datasets_app.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E 'Step CD-|E2E_DATASET_APP_MARK' /tmp/e2e_cluster_datasets_app.log | while IFS= read -r line; do
              echo "::notice title=cluster-datasets-app-e2e::$line"
            done || true
            grep -E 'E2E_DATASET_APP_FAIL' /tmp/e2e_cluster_datasets_app.log | while IFS= read -r line; do
              echo "::error title=cluster-datasets-app-e2e::$line"
            done || true
          fi

      - name: Locate and Measure arm64 DMG
        run: |
          DMG_FILE=$(find src-tauri/target -iname "*aarch64*.dmg" -o -iname "*arm64*.dmg" 2>/dev/null | head -n 1)
          if [ -z "${DMG_FILE}" ]; then
            DMG_FILE=$(find src-tauri/target -iname "*.dmg" -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "${DMG_FILE}" ]; then
            DMG_FILE=$(find . -iname "*.dmg" -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "${DMG_FILE}" ] || [ ! -f "${DMG_FILE}" ]; then
            echo "Error: Could not locate built arm64 .dmg file!" >&2
            exit 1
          fi
          DMG_ABS="$(cd "$(dirname "${DMG_FILE}")" && pwd)/$(basename "${DMG_FILE}")"
          DMG_BYTES=$(stat -f %z "${DMG_ABS}" 2>/dev/null || wc -c < "${DMG_ABS}")
          DMG_HUMAN=$(ls -lh "${DMG_ABS}" | awk '{print $5}')
          echo "DMG_PATH=${DMG_ABS}" >> $GITHUB_ENV
          echo "DMG_BYTES=${DMG_BYTES}" >> $GITHUB_ENV
          echo "DMG_HUMAN=${DMG_HUMAN}" >> $GITHUB_ENV
          echo "Located arm64 DMG at: ${DMG_ABS} (${DMG_HUMAN}, ${DMG_BYTES} bytes)"
          echo "::notice title=DMG-arm64::$(basename "${DMG_ABS}") ${DMG_BYTES} bytes"
          echo "### Desktop macOS (arm64) DMG Artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`$(basename "${DMG_ABS}")\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${DMG_HUMAN} (${DMG_BYTES} bytes)" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: coperceive-desktop-macos-arm64
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error
      - name: Bundle Python Standalone Runtime for Intel Mac
        run: python3 scripts/desktop/bundle_python.py --target x86_64-apple-darwin --skip-web-build
      - name: Build Tauri Desktop Intel DMG
        run: bash scripts/desktop/build_dmg.sh x86_64-apple-darwin
      - name: Locate and Measure Intel DMG
        run: |
          DMG_INTEL=$(find src-tauri/target -iname "*x64*.dmg" -o -iname "*x86_64*.dmg" 2>/dev/null | head -n 1)
          if [ -z "${DMG_INTEL}" ]; then
            DMG_INTEL=$(find src-tauri/target/x86_64-apple-darwin -iname "*.dmg" -type f 2>/dev/null | head -n 1)
          fi
          if [ -z "${DMG_INTEL}" ] || [ ! -f "${DMG_INTEL}" ]; then
            echo "Error: Could not locate built Intel .dmg file!" >&2
            exit 1
          fi
          DMG_INTEL_ABS="$(cd "$(dirname "${DMG_INTEL}")" && pwd)/$(basename "${DMG_INTEL}")"
          DMG_INTEL_BYTES=$(stat -f %z "${DMG_INTEL_ABS}" 2>/dev/null || wc -c < "${DMG_INTEL_ABS}")
          DMG_INTEL_HUMAN=$(ls -lh "${DMG_INTEL_ABS}" | awk '{print $5}')
          echo "DMG_INTEL_PATH=${DMG_INTEL_ABS}" >> $GITHUB_ENV
          echo "Located Intel DMG at: ${DMG_INTEL_ABS} (${DMG_INTEL_HUMAN}, ${DMG_INTEL_BYTES} bytes)"
          echo "::notice title=DMG-Intel::$(basename "${DMG_INTEL_ABS}") ${DMG_INTEL_BYTES} bytes"
          echo "### Desktop macOS (Intel x86_64) DMG Artifact" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`$(basename "${DMG_INTEL_ABS}")\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${DMG_INTEL_HUMAN} (${DMG_INTEL_BYTES} bytes)" >> $GITHUB_STEP_SUMMARY
      - name: Verify Intel Mac App Bundle Under Rosetta
        run: |
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta 2 is available on arm64 runner: executing Intel x86_64 verification"
            APP_INTEL="$(find src-tauri/target/x86_64-apple-darwin -type d -name Coperceive.app | head -n 1)"
            if [ -z "${APP_INTEL}" ]; then
              APP_INTEL="$(find src-tauri/target -type d -name Coperceive.app | head -n 1)"
            fi
            echo "Intel App path: ${APP_INTEL}"
            PY_INTEL="${APP_INTEL}/Contents/Resources/resources/python/bin/python3"
            if [ ! -x "${PY_INTEL}" ]; then
              echo "Error: Bundled Intel python3 not found or not executable at ${PY_INTEL}" >&2
              exit 1
            fi
            echo "Testing bundled Intel python3 under Rosetta:"
            arch -x86_64 "${PY_INTEL}" -c "import coperceive, numpy, pyarrow, PIL; print('Intel Python loaded successfully; PIL version:', PIL.__version__)"
            echo "Running smoke test on Intel .app under Rosetta:"
            arch -x86_64 bash scripts/desktop/smoke_test.sh "${APP_INTEL}"
            echo "::notice title=Rosetta-Test::Intel Mac build verified under Rosetta 2"
          else
            echo "::notice title=Rosetta-Test::Rosetta 2 is not available on this runner (arch -x86_64 returned non-zero)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coperceive-desktop-macos-x86_64
          path: ${{ env.DMG_INTEL_PATH }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-screenshots
          path: /tmp/e2e-shots/*.png
          if-no-files-found: ignore
