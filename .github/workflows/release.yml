name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build all packages and generate latest.json without publishing"
        type: boolean
        default: true
        required: false

permissions:
  contents: write

jobs:
  # A tag builds whatever commit it points at; the release must not ship a
  # commit whose tests fail (docs/release/v0.1.0-checklist.md, gap G4). The same
  # checks as ci.yml's lint, test and web jobs, on one Python.
  checks:
    runs-on: ubuntu-latest
    # Only the build job publishes the release; the checks only read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m venv .venv
      - name: Constraints from uv.lock
        run: |
          .venv/bin/pip install uv
          .venv/bin/uv export --frozen --all-extras --no-hashes --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/constraints.txt" > /dev/null
      - run: .venv/bin/pip install -c "$RUNNER_TEMP/constraints.txt" -e ".[app,griffin,dev,viewer]"
      - run: .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pyright
      - name: Python tests
        run: .venv/bin/pytest -q --tb=line
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Web tests
        working-directory: web
        run: |
          npx tsc -b
          npm test

  build-macos:
    needs: checks
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: bash scripts/build_web_static.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "macos-tauri"
      - name: Cache bundled Python runtime and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coperceive-desktop
            ~/Library/Caches/pip
          key: bundled-python-${{ runner.os }}-${{ hashFiles('scripts/desktop/requirements-darwin-arm64.lock') }}
          restore-keys: |
            bundled-python-${{ runner.os }}-
      - name: Bundle Python Standalone Runtime (arm64)
        run: bash scripts/desktop/bundle_python.sh
      - name: Sync Desktop Bundle Version
        run: bash scripts/desktop/sync_version.sh
      - name: Enable updater artifacts for the release build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error title=UpdaterKey::TAURI_SIGNING_PRIVATE_KEY is not set; see docs/desktop/updates.md" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          path = "src-tauri/tauri.conf.json"
          with open(path) as f:
              conf = json.load(f)
          conf["bundle"]["createUpdaterArtifacts"] = True
          with open(path, "w") as f:
              json.dump(conf, f, indent=2)
          PY
      - name: Build Tauri Desktop & Updater Bundle (arm64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/desktop/build_dmg.sh aarch64-apple-darwin
      - name: Verify packaged app ships the viewer bundle
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            APP="src-tauri/target/${target}/release/bundle/macos/Coperceive.app"
            test -d "${APP}" || { echo "No Coperceive.app found for ${target} at ${APP}" >&2; exit 1; }
            python3 scripts/check_bundle_assets.py --app "${APP}"
          done
      - name: Prepare macOS Release Assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets-macos
          ARM64_BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"

          test -f "${ARM64_BUNDLE}/macos/Coperceive.app.tar.gz" || { echo "::error::Missing arm64 updater tar.gz" >&2; exit 1; }

          cp "${ARM64_BUNDLE}/macos/Coperceive.app.tar.gz" release-assets-macos/Coperceive_aarch64.app.tar.gz

          ARM64_DMG="$(find "${ARM64_BUNDLE}/dmg" -name "*.dmg" 2>/dev/null | head -n 1)"
          test -n "${ARM64_DMG}" && test -f "${ARM64_DMG}" || { echo "::error::Missing arm64 DMG" >&2; exit 1; }
          cp "${ARM64_DMG}" release-assets-macos/

          APP_VERSION="$(python3 -c "import tomllib; f = open('pyproject.toml', 'rb'); print(tomllib.load(f)['project']['version'])")"
          (cd web && npx tauri signer sign "../release-assets-macos/Coperceive_aarch64.app.tar.gz" --app-version "${APP_VERSION}")

          test -f "release-assets-macos/Coperceive_aarch64.app.tar.gz" || { echo "::error::Missing Coperceive_aarch64.app.tar.gz" >&2; exit 1; }
          test -f "release-assets-macos/Coperceive_aarch64.app.tar.gz.sig" || { echo "::error::Missing Coperceive_aarch64.app.tar.gz.sig" >&2; exit 1; }
          test -f "release-assets-macos/$(basename "${ARM64_DMG}")" || { echo "::error::Missing ARM64 DMG in release-assets" >&2; exit 1; }
          ls -la release-assets-macos/
      - name: Run macOS Smoke Test on Installed DMGs (arm64 and Intel via Rosetta)
        run: |
          ARM64_DMG="$(find release-assets-macos -maxdepth 1 -type f \( -name "*aarch64*.dmg" -o -name "*arm64*.dmg" \) | head -n 1)"
          INTEL_DMG="$(find release-assets-macos -maxdepth 1 -type f \( -name "*x64*.dmg" -o -name "*x86_64*.dmg" \) | head -n 1)"
          test -n "${ARM64_DMG}" && test -f "${ARM64_DMG}" || { echo "::error::Missing arm64 DMG in release-assets-macos" >&2; exit 1; }
          test -n "${INTEL_DMG}" && test -f "${INTEL_DMG}" || { echo "::error::Missing Intel DMG in release-assets-macos" >&2; exit 1; }

          smoke_dmg() {
            local dmg="$1"
            local arch_prefix="$2"
            local tag="$3"
            (
              set -euo pipefail
              local mount_dir="${RUNNER_TEMP}/mnt-${tag}"
              local install_dir="${RUNNER_TEMP}/app-${tag}"
              local app_path="${install_dir}/Coperceive.app"
              cleanup_dmg() {
                hdiutil detach "${mount_dir}" -force >/dev/null 2>&1 || true
                rm -rf "${mount_dir}" "${install_dir}"
              }
              trap cleanup_dmg EXIT
              rm -rf "${mount_dir}" "${install_dir}"
              mkdir -p "${mount_dir}" "${install_dir}"
              hdiutil attach "${dmg}" -nobrowse -readonly -mountpoint "${mount_dir}"
              cp -R "${mount_dir}/Coperceive.app" "${app_path}"
              hdiutil detach "${mount_dir}" || hdiutil detach "${mount_dir}" -force || true
              if [ -n "${arch_prefix}" ]; then
                local py_intel="${app_path}/Contents/Resources/resources/python/bin/python3"
                test -x "${py_intel}" || { echo "::error::Bundled Intel python3 missing at ${py_intel}" >&2; exit 1; }
                ${arch_prefix} "${py_intel}" -c "import coperceive, numpy, pyarrow, PIL; print('Intel Python loaded successfully; PIL version:', PIL.__version__)"
                ${arch_prefix} bash scripts/desktop/smoke_test.sh "${app_path}" "${dmg}"
              else
                bash scripts/desktop/smoke_test.sh "${app_path}" "${dmg}"
              fi
            )
          }

          smoke_dmg "${ARM64_DMG}" "" "arm64"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            smoke_dmg "${INTEL_DMG}" "arch -x86_64" "intel"
          else
            echo "::error title=Rosetta-Test::Rosetta 2 is not available on this runner" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets-macos/*
          if-no-files-found: error

  build-windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Constraints from uv.lock
        shell: bash
        run: |
          pip install uv
          uv export --frozen --all-extras --no-hashes --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/constraints.txt" > /dev/null
      - shell: bash
        run: pip install -c "$RUNNER_TEMP/constraints.txt" -e ".[app]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Build web static assets
        shell: bash
        run: bash scripts/build_web_static.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "windows-tauri"
      - name: Cache bundled Python runtime and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\coperceive-desktop
            ~\AppData\Local\pip\Cache
          key: bundled-python-${{ runner.os }}-${{ hashFiles('scripts/desktop/requirements-windows-x86_64.lock') }}
          restore-keys: |
            bundled-python-${{ runner.os }}-
      - name: Bundle Python Standalone Runtime
        shell: bash
        run: python scripts/desktop/bundle_python.py --target x86_64-pc-windows-msvc --skip-web-build
      - name: Sync Desktop Bundle Version
        shell: bash
        run: bash scripts/desktop/sync_version.sh
      - name: Enable updater artifacts for the release build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is not set; see docs/desktop/updates.md"
            exit 1
          }
          python -c @"
          import json
          path = 'src-tauri/tauri.conf.json'
          with open(path) as f:
              conf = json.load(f)
          conf['bundle']['createUpdaterArtifacts'] = True
          with open(path, 'w') as f:
              json.dump(conf, f, indent=2)
          "@
      - name: Build Tauri Desktop (NSIS installer & updater)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd web && npm run tauri build -- --bundles nsis --verbose
      - name: Verify packaged app ships the viewer bundle
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer found"
            exit 1
          }
          $extractDir = Join-Path $env:RUNNER_TEMP "nsis-extract"
          7z x $installer.FullName -o"$extractDir"
          python scripts/check_bundle_assets.py --app $extractDir
      - name: Prepare Windows Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets-windows
          $bundleNsis = "src-tauri\target\release\bundle\nsis"
          $exe = Get-ChildItem -Path $bundleNsis -Filter "*setup.exe" -Recurse | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Missing NSIS installer exe (*setup.exe)"
            exit 1
          }
          $sig = Get-ChildItem -Path $bundleNsis -Filter "*setup.exe.sig" -Recurse | Select-Object -First 1
          if (-not $sig) {
            Write-Error "Missing NSIS installer signature (*setup.exe.sig)"
            exit 1
          }
          Copy-Item -Path $exe.FullName -Destination release-assets-windows\
          Copy-Item -Path $sig.FullName -Destination release-assets-windows\
          Get-ChildItem -Path release-assets-windows
      - name: Run Windows Smoke Test on Installed NSIS Package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-assets-windows -Filter "*setup.exe" | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer found in release-assets-windows"
            exit 1
          }
          Write-Host "Installing NSIS package silently: $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3

          $installedExe = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "coperceive-desktop.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installedExe) {
            $installedExe = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "Coperceive.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $installedExe) {
            Write-Host "Falling back to search across LOCALAPPDATA and PROGRAMFILES..."
            $installedExe = Get-ChildItem -Path @($env:LOCALAPPDATA, $env:ProgramFiles) -Filter "*coperceive*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          }
          if (-not $installedExe) {
            Write-Error "Could not locate installed coperceive executable after silent install"
            exit 1
          }
          Write-Host "Found installed application at $($installedExe.FullName)"
          $installDir = $installedExe.DirectoryName

          pwsh scripts/desktop/smoke_test_windows.ps1 $installedExe.FullName

          $uninstaller = Get-ChildItem -Path $installDir -Filter "*uninstall*.exe" | Select-Object -First 1
          if (-not $uninstaller) {
            Write-Error "Could not find uninstaller in $installDir"
            exit 1
          }
          Write-Host "Uninstalling silently: $($uninstaller.FullName)"
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S _?=$installDir" -Wait
          Start-Sleep -Seconds 3

          if (Test-Path $installedExe.FullName) {
            Write-Error "Installed exe $($installedExe.FullName) still exists after silent uninstall!"
            exit 1
          }
          Write-Host "Uninstall verified: $installDir is removed."
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets-windows/*
          if-no-files-found: error

  build-linux:
    needs: checks
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Constraints from uv.lock
        run: |
          pip install uv
          uv export --frozen --all-extras --no-hashes --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/constraints.txt" > /dev/null
      - run: pip install -c "$RUNNER_TEMP/constraints.txt" -e ".[app]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Build web static assets
        run: bash scripts/build_web_static.sh
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 imagemagick libfuse2 squashfs-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "linux-tauri"
      - name: Cache bundled Python runtime and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coperceive-desktop
            ~/.cache/pip
          key: bundled-python-${{ runner.os }}-${{ hashFiles('scripts/desktop/requirements-linux-x86_64.lock') }}
          restore-keys: |
            bundled-python-${{ runner.os }}-
      - name: Bundle Python Standalone Runtime
        run: python scripts/desktop/bundle_python.py --target x86_64-unknown-linux-gnu --skip-web-build
      - name: Sync Desktop Bundle Version
        run: bash scripts/desktop/sync_version.sh
      - name: Enable updater artifacts for the release build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error title=UpdaterKey::TAURI_SIGNING_PRIVATE_KEY is not set; see docs/desktop/updates.md" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          path = "src-tauri/tauri.conf.json"
          with open(path) as f:
              conf = json.load(f)
          conf["bundle"]["createUpdaterArtifacts"] = True
          with open(path, "w") as f:
              json.dump(conf, f, indent=2)
          PY
      - name: Build Tauri Desktop (deb, AppImage & updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd web && npm run tauri build -- --bundles deb,appimage --verbose
      - name: Verify packaged app ships the viewer bundle
        run: |
          DEB_FILE=$(find src-tauri/target -iname "*.deb" -type f | head -n 1)
          test -n "${DEB_FILE}" || { echo "No .deb package found" >&2; exit 1; }
          python3 scripts/check_bundle_assets.py --app "${DEB_FILE}"
      - name: Prepare Linux Release Assets
        run: |
          mkdir -p release-assets-linux
          DEB_FILE="$(find src-tauri/target/release/bundle/deb -type f -name "*.deb" | head -n 1)"
          test -n "${DEB_FILE}" && test -f "${DEB_FILE}" || { echo "::error::Missing Linux .deb" >&2; exit 1; }
          cp "${DEB_FILE}" release-assets-linux/

          APPIMAGE_FILE="$(find src-tauri/target/release/bundle/appimage -type f -name "*.AppImage" | head -n 1)"
          test -n "${APPIMAGE_FILE}" && test -f "${APPIMAGE_FILE}" || { echo "::error::Missing Linux .AppImage" >&2; exit 1; }
          cp "${APPIMAGE_FILE}" release-assets-linux/

          APPIMAGE_SIG="$(find src-tauri/target/release/bundle/appimage -type f -name "*.AppImage.sig" | head -n 1)"
          test -n "${APPIMAGE_SIG}" && test -f "${APPIMAGE_SIG}" || { echo "::error::Missing Linux .AppImage.sig" >&2; exit 1; }
          cp "${APPIMAGE_SIG}" release-assets-linux/

          test -f "release-assets-linux/$(basename "${DEB_FILE}")" || exit 1
          test -f "release-assets-linux/$(basename "${APPIMAGE_FILE}")" || exit 1
          test -f "release-assets-linux/$(basename "${APPIMAGE_SIG}")" || exit 1
          ls -la release-assets-linux/
      - name: Run Linux Smoke Test on Installed Debian Package
        run: |
          DEB_FILE="$(find release-assets-linux -maxdepth 1 -type f -name "*.deb" | head -n 1)"
          test -n "${DEB_FILE}" || { echo "No .deb package found in release-assets-linux" >&2; exit 1; }
          DEB_ABS="$(readlink -f "${DEB_FILE}")"
          echo "Installing ${DEB_ABS} via apt-get..."
          sudo apt-get install -y "${DEB_ABS}"
          INSTALLED_BIN="/usr/bin/coperceive-desktop"
          test -x "${INSTALLED_BIN}" || { echo "Installed binary not found at ${INSTALLED_BIN}" >&2; exit 1; }
          xvfb-run -a -s "-screen 0 1920x1080x24" bash scripts/desktop/smoke_test_linux.sh "${INSTALLED_BIN}"
          echo "Removing installed Debian package..."
          PKG_NAME="$(dpkg-deb -f "${DEB_ABS}" Package 2>/dev/null || echo coperceive)"
          sudo dpkg -r "${PKG_NAME}" || sudo apt-get remove -y "${PKG_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets-linux/*
          if-no-files-found: error

  publish-release:
    needs: [checks, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync Desktop Bundle Version
        run: bash scripts/desktop/sync_version.sh
      - name: Download macOS Release Assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets
      - name: Download Windows Release Assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets
      - name: Download Linux Release Assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets
      - name: Write latest.json for the updater
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            TAG_NAME="v$(python3 -c "import tomllib; f = open('pyproject.toml', 'rb'); print(tomllib.load(f)['project']['version'])")"
          fi
          echo "Writing latest.json for release tag ${TAG_NAME}..."
          python3 scripts/desktop/write_latest_json.py \
            --conf src-tauri/tauri.conf.json \
            --tag "${TAG_NAME}" \
            --assets release-assets \
            --repo "${GITHUB_REPOSITORY}" \
            --out release-assets/latest.json \
            --require-all
          cat release-assets/latest.json
      - name: Install minisign and verify updater signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 -c "import json, base64; conf = json.load(open('src-tauri/tauri.conf.json')); open('minisign.pub', 'wb').write(base64.b64decode(conf['plugins']['updater']['pubkey']))"
          echo "Public key file created:"
          cat minisign.pub
          for file in \
            release-assets/Coperceive_aarch64.app.tar.gz \
            release-assets/Coperceive_*_amd64.AppImage \
            release-assets/Coperceive_*_x64-setup.exe; do
            if [ -f "${file}" ]; then
              echo "Verifying ${file} with minisign -Vm..."
              python3 -c "import base64, sys; data = open(sys.argv[1], 'rb').read().strip(); d = base64.b64decode(data) if not data.startswith(b'untrusted comment:') else data; open(sys.argv[2], 'wb').write(d)" "${file}.sig" "${file}.minisig"
              minisign -Vm "${file}" -x "${file}.minisig" -p minisign.pub
              rm -f "${file}.minisig"
            else
              echo "::error::File ${file} does not exist" >&2
              exit 1
            fi
          done
          echo "All updater signatures verified successfully with minisign -Vm."
      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run) }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
      - name: Summary for Dry Run
        if: ${{ github.ref_type != 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          echo "### Release Dry Run Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Release assets generated for tag ${TAG_NAME}:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh release-assets >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Generated latest.json" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat release-assets/latest.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload Dry Run Assets Artifact
        if: ${{ github.ref_type != 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-assets
          path: release-assets/*
