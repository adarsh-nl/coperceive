name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # --legacy-peer-deps: openapi-typescript's peer range predates TypeScript 6
      # (see web/package.json); npm 10+ refuses the install without this.
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: bash scripts/build_web_static.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Bundle Python Standalone Runtime
        run: bash scripts/desktop/bundle_python.sh
      - name: Sync Desktop Bundle Version
        run: bash scripts/desktop/sync_version.sh
      - name: Build Tauri Desktop & Updater Bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/desktop/build_dmg.sh
      - name: Report Tauri Build Failure
        if: failure()
        run: |
          if [ -f /tmp/tauri_build.log ]; then
            echo "### Tauri Build Failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 /tmp/tauri_build.log >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 45 /tmp/tauri_build.log | while IFS= read -r line; do
              echo "::error title=TauriBuildError::$line"
            done
          fi
      - name: Verify packaged app ships the viewer bundle
        run: |
          APP="$(find src-tauri/target -type d -name Coperceive.app | head -n 1)"
          test -n "${APP}" || { echo "No Coperceive.app found" >&2; exit 1; }
          python3 scripts/check_bundle_assets.py --app "${APP}"
      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find src-tauri/target/aarch64-apple-darwin/release/bundle -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.sig" -o -name "latest.json" \) -exec cp {} release-assets/ \;
          ls -la release-assets/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
