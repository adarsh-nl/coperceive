name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build all packages and generate latest.json without publishing"
        type: boolean
        default: true
        required: false

permissions:
  contents: write

jobs:
  # A tag builds whatever commit it points at; the release must not ship a
  # commit whose tests fail (docs/release/v0.1.0-checklist.md, gap G4). The same
  # checks as ci.yml's lint, test and web jobs, on one Python.
  checks:
    runs-on: ubuntu-latest
    # Only the build job publishes the release; the checks only read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[app,griffin,dev,viewer]"
      - run: .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pyright
      - name: Python tests
        run: .venv/bin/pytest -q --tb=line
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Web tests
        working-directory: web
        run: |
          npx tsc -b
          npm test

  build-macos:
    needs: checks
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: bash scripts/build_web_static.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "macos-tauri"
      - name: Cache bundled Python runtime and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coperceive-desktop
            ~/Library/Caches/pip
          key: bundled-python-${{ runner.os }}-${{ hashFiles('scripts/desktop/requirements-darwin-arm64.lock') }}
          restore-keys: |
            bundled-python-${{ runner.os }}-
      - name: Bundle Python Standalone Runtime (arm64)
        run: bash scripts/desktop/bundle_python.sh
      - name: Sync Desktop Bundle Version
        run: bash scripts/desktop/sync_version.sh
      - name: Enable updater artifacts for the release build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error title=UpdaterKey::TAURI_SIGNING_PRIVATE_KEY is not set; see docs/desktop/updates.md" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          path = "src-tauri/tauri.conf.json"
          with open(path) as f:
              conf = json.load(f)
          conf["bundle"]["createUpdaterArtifacts"] = True
          with open(path, "w") as f:
              json.dump(conf, f, indent=2)
          PY
      - name: Build Tauri Desktop & Updater Bundle (arm64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/desktop/build_dmg.sh aarch64-apple-darwin
      - name: Bundle Python Standalone Runtime for Intel Mac
        run: python3 scripts/desktop/bundle_python.py --target x86_64-apple-darwin --skip-web-build
      - name: Build Tauri Desktop & Updater Bundle (Intel x86_64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/desktop/build_dmg.sh x86_64-apple-darwin
      - name: Verify packaged app ships the viewer bundle
        run: |
          APP="$(find src-tauri/target -type d -name Coperceive.app | head -n 1)"
          test -n "${APP}" || { echo "No Coperceive.app found" >&2; exit 1; }
          python3 scripts/check_bundle_assets.py --app "${APP}"
      - name: Prepare macOS Release Assets
        run: |
          mkdir -p release-assets-macos
          ARM64_BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          if [ -f "${ARM64_BUNDLE}/macos/Coperceive.app.tar.gz" ]; then
            cp "${ARM64_BUNDLE}/macos/Coperceive.app.tar.gz" release-assets-macos/Coperceive.app.tar.gz
            cp "${ARM64_BUNDLE}/macos/Coperceive.app.tar.gz.sig" release-assets-macos/Coperceive.app.tar.gz.sig
          fi
          ARM64_DMG="$(find "${ARM64_BUNDLE}/dmg" -name "*.dmg" 2>/dev/null | head -n 1)"
          if [ -n "${ARM64_DMG}" ]; then
            cp "${ARM64_DMG}" release-assets-macos/
          fi

          INTEL_BUNDLE="src-tauri/target/x86_64-apple-darwin/release/bundle"
          if [ -f "${INTEL_BUNDLE}/macos/Coperceive.app.tar.gz" ]; then
            cp "${INTEL_BUNDLE}/macos/Coperceive.app.tar.gz" release-assets-macos/Coperceive-x86_64.app.tar.gz
            cp "${INTEL_BUNDLE}/macos/Coperceive.app.tar.gz.sig" release-assets-macos/Coperceive-x86_64.app.tar.gz.sig
          fi
          INTEL_DMG="$(find "${INTEL_BUNDLE}/dmg" -name "*.dmg" 2>/dev/null | head -n 1)"
          if [ -n "${INTEL_DMG}" ]; then
            cp "${INTEL_DMG}" release-assets-macos/
          fi
          ls -la release-assets-macos/
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets-macos/*
          if-no-files-found: error

  build-windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[app]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Build web static assets
        shell: bash
        run: bash scripts/build_web_static.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "windows-tauri"
      - name: Cache bundled Python runtime and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\coperceive-desktop
            ~\AppData\Local\pip\Cache
          key: bundled-python-${{ runner.os }}-${{ hashFiles('scripts/desktop/requirements-windows-x86_64.lock') }}
          restore-keys: |
            bundled-python-${{ runner.os }}-
      - name: Bundle Python Standalone Runtime
        shell: bash
        run: python scripts/desktop/bundle_python.py --target x86_64-pc-windows-msvc --skip-web-build
      - name: Sync Desktop Bundle Version
        shell: bash
        run: bash scripts/desktop/sync_version.sh
      - name: Enable updater artifacts for the release build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY is not set; see docs/desktop/updates.md"
            exit 1
          }
          python -c @"
          import json
          path = 'src-tauri/tauri.conf.json'
          with open(path) as f:
              conf = json.load(f)
          conf['bundle']['createUpdaterArtifacts'] = True
          with open(path, 'w') as f:
              json.dump(conf, f, indent=2)
          "@
      - name: Build Tauri Desktop (NSIS installer & updater)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd web && npm run tauri build -- --bundles nsis --verbose
      - name: Verify packaged app ships the viewer bundle
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer found"
            exit 1
          }
          $extractDir = Join-Path $env:RUNNER_TEMP "nsis-extract"
          7z x $installer.FullName -o"$extractDir"
          python scripts/check_bundle_assets.py --app $extractDir
      - name: Prepare Windows Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets-windows
          $bundleNsis = "src-tauri\target\release\bundle\nsis"
          Get-ChildItem -Path $bundleNsis -Include @("*.exe", "*.sig", "*.zip") -Recurse | Where-Object { $_.Name -notmatch "uninstall" } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination release-assets-windows\
          }
          Get-ChildItem -Path release-assets-windows
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets-windows/*
          if-no-files-found: error

  build-linux:
    needs: checks
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[app]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - name: Build web static assets
        run: bash scripts/build_web_static.sh
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 imagemagick
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "linux-tauri"
      - name: Cache bundled Python runtime and pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coperceive-desktop
            ~/.cache/pip
          key: bundled-python-${{ runner.os }}-${{ hashFiles('scripts/desktop/requirements-linux-x86_64.lock') }}
          restore-keys: |
            bundled-python-${{ runner.os }}-
      - name: Bundle Python Standalone Runtime
        run: python scripts/desktop/bundle_python.py --target x86_64-unknown-linux-gnu --skip-web-build
      - name: Sync Desktop Bundle Version
        run: bash scripts/desktop/sync_version.sh
      - name: Enable updater artifacts for the release build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error title=UpdaterKey::TAURI_SIGNING_PRIVATE_KEY is not set; see docs/desktop/updates.md" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          path = "src-tauri/tauri.conf.json"
          with open(path) as f:
              conf = json.load(f)
          conf["bundle"]["createUpdaterArtifacts"] = True
          with open(path, "w") as f:
              json.dump(conf, f, indent=2)
          PY
      - name: Build Tauri Desktop (deb, AppImage & updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd web && npm run tauri build -- --bundles deb,appimage --verbose
      - name: Verify packaged app ships the viewer bundle
        run: |
          DEB_FILE=$(find src-tauri/target -iname "*.deb" -type f | head -n 1)
          test -n "${DEB_FILE}" || { echo "No .deb package found" >&2; exit 1; }
          python3 scripts/check_bundle_assets.py --app "${DEB_FILE}"
      - name: Prepare Linux Release Assets
        run: |
          mkdir -p release-assets-linux
          find src-tauri/target/release/bundle/deb -type f -name "*.deb" -exec cp {} release-assets-linux/ \;
          find src-tauri/target/release/bundle/appimage -type f \( -name "*.AppImage" -o -name "*.AppImage.sig" -o -name "*.tar.gz" -o -name "*.tar.gz.sig" \) -exec cp {} release-assets-linux/ \;
          ls -la release-assets-linux/
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets-linux/*
          if-no-files-found: error

  publish-release:
    needs: [checks, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync Desktop Bundle Version
        run: bash scripts/desktop/sync_version.sh
      - name: Download macOS Release Assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets
      - name: Download Windows Release Assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets
      - name: Download Linux Release Assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-linux
          path: release-assets
      - name: Write latest.json for the updater
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            TAG_NAME="v$(python3 -c "import tomllib; f = open('pyproject.toml', 'rb'); print(tomllib.load(f)['project']['version'])")"
          fi
          echo "Writing latest.json for release tag ${TAG_NAME}..."
          python3 scripts/desktop/write_latest_json.py \
            --conf src-tauri/tauri.conf.json \
            --tag "${TAG_NAME}" \
            --assets release-assets \
            --repo "${GITHUB_REPOSITORY}" \
            --out release-assets/latest.json \
            --require-all
          cat release-assets/latest.json
      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run) }}
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
      - name: Summary for Dry Run
        if: ${{ github.ref_type != 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          echo "### Release Dry Run Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "Release assets generated for tag ${TAG_NAME}:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh release-assets >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Generated latest.json" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat release-assets/latest.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload Dry Run Assets Artifact
        if: ${{ github.ref_type != 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-assets
          path: release-assets/*
