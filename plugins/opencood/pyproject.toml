[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coperceive-opencood-model"
version = "0.1.0"
description = "coperceive model plugin for OpenCOOD checkpoints (CoBEVT LiDAR on V2XSet): a worker that runs the user's OpenCOOD environment"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = []

[project.entry-points."coperceive.models"]
opencood = "coperceive_opencood_model:MANIFEST"

[tool.setuptools.packages.find]
where = ["."]
include = ["coperceive_opencood_model*"]

[tool.setuptools.package-data]
coperceive_opencood_model = ["model.yaml"]
