[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coperceive-griffin-model"
version = "0.1.0"
description = "coperceive model plugin for the released Griffin (Agile) checkpoints: a Python 3.8 worker that runs the Griffin toolkit in its own conda environment"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = []

[project.entry-points."coperceive.models"]
griffin = "coperceive_griffin_model:MANIFEST"

[tool.setuptools.packages.find]
where = ["."]
include = ["coperceive_griffin_model*"]

[tool.setuptools.package-data]
coperceive_griffin_model = ["model.yaml"]
