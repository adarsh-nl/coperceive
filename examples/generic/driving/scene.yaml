schema: coperceive-generic-1
scene_id: generic-driving
handedness: right
frame_rate_hz: 2
frame_count: 3
agents:
  - id: ego
    role: vehicle
    poses: agents/ego/poses.csv
    boxes: agents/ego/boxes.csv
    sensors:
      - id: lidar
        modality: lidar
        files: "agents/ego/lidar/{frame:06d}.pcd"
      - id: front
        modality: camera
        files: "agents/ego/camera/{frame:06d}.png"
        intrinsic: [300.0, 300.0, 320.0, 240.0]
  - id: cav
    role: vehicle
    poses: agents/cav/poses.csv
    boxes: agents/cav/boxes.csv
    sensors:
      - id: lidar
        modality: lidar
        files: "agents/cav/lidar/{frame:06d}.pcd"
